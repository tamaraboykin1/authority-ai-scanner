<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authority AI Scanner — Free AI Visibility Report</title>
    <script type="module" crossorigin src="/assets/index-BxHwD3I9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Der6EjV_.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="/contact-name-inject.js"></script>
    <script>
      // Add Back to Home button - visible on all devices including mobile
      (function() {
        function addBackButton() {
          if (document.getElementById('back-home-btn')) return;
          var btn = document.createElement('a');
          btn.id = 'back-home-btn';
          btn.href = 'https://authorityaisystems.com';
          btn.innerHTML = '&larr; Back to Home';
          btn.style.cssText = 'display:block;position:fixed;top:0;left:0;right:0;z-index:99999;background:#2563eb;color:#fff;padding:10px 18px;font-size:14px;font-weight:600;text-decoration:none;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
          document.body.style.paddingTop = '40px';
          document.body.insertBefore(btn, document.body.firstChild);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', addBackButton);
        } else {
          addBackButton();
        }
      })();

      // Fix scan results CTA buttons to use email instead of website redirect
      (function() {
        function fixButtons() {
          var allLinks = document.querySelectorAll('a');
          allLinks.forEach(function(link) {
            var text = link.textContent.trim().toLowerCase();
            // Fix "Contact Us" button - send email
            if (text === 'contact us') {
              link.href = 'mailto:info@authorityaisystems.com?subject=Authority%20AI%20-%20I%20Want%20To%20Get%20Started';
              link.removeAttribute('target');
            }
            // Fix "Fix My AI Visibility Now" / "Get My AI Visibility Fixed" button - send email
            if (text.indexOf('fix') !== -1 && text.indexOf('visibility') !== -1) {
              link.href = 'mailto:info@authorityaisystems.com?subject=Authority%20AI%20-%20Fix%20My%20AI%20Visibility';
              link.removeAttribute('target');
            }
          });
        }
        // Run on page load and watch for dynamic content changes
        var observer = new MutationObserver(function() { fixButtons(); });
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            fixButtons();
            observer.observe(document.body, { childList: true, subtree: true });
          });
        } else {
          fixButtons();
          observer.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>
    <script>window.AUTHORITY_CHAT_API = window.location.origin;</script>
    <script src="/chatbot-widget.js" defer></script>
  </body>
</html>
